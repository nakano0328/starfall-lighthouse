name: 機能提案
description: 新機能や改善案の提案
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        スコープ外（オープンワールド、マルチプレイ等）は `docs/PLAN.md` §1.6 を参照してください。
  - type: textarea
    id: goal
    attributes:
      label: 目的
      description: 誰のどんな困りごと・体験を良くしたいか
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 具体的な仕様・画面・操作のイメージ
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した他の方法があれば
    validations:
      required: false
  - type: dropdown
    id: phase
    attributes:
      label: 対象Phase
      description: docs/PLAN.md §3 の工程に対応します
      options:
        - 未定
        - Phase 1 リポジトリ・開発基盤
        - Phase 2 フィールド基盤
        - Phase 3 戦闘システム
        - Phase 4 コンテンツ制作
        - Phase 5 ゲームフロー仕上げ
        - Phase 6 アート・サウンド
        - Phase 7 QA・バランス
        - Phase 8 リリース
        - Phase 9 リリース後（任意）
      default: 0
    validations:
      required: true
